site_name: Cisco Data Center Labs
site_url: https://titusm.github.io/Cisco-Data-Center/
repo_url: https://github.com/TitusM/Cisco-Data-Center
repo_name: TitusM/Cisco-Data-Center

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.collapse
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - UCS & SAN:
      - Overview: ucs-san/index.md
      - Standalone Labs:
          - Configure a Service Profile: ucs-san/14-service-profile-standalone.md
          - Configure Basic Identity Pools: ucs-san/15-identity-pools-standalone.md
  - NX-OS:
      - Overview: nx-os/index.md
      - Virtual Port-Channel Basic Configuration: nx-os/virtual-port-channel-basic-configuration.md
  - ACI:
      - Overview: aci/index.md
      - Fabric Foundation:
          - Fabric Bring Up – from Scratch!: aci/fabric-bring-up.md
          - Virtual Port-Channel (vPC): aci/virtual-port-channel-vpc.md
      - Policy & Segmentation:
          - Contracts: aci/contracts.md
          - Endpoint Security Groups (ESGs): aci/endpoint-security-groups.md
          - L4-L7 Policy-Based Redirect (PBR): aci/l4-l7-pbr.md
      - External Connectivity:
          - L3OUT (BGP & OSPF) Configuration: aci/l3out-bgp-ospf.md
          - External Layer 3 Network Connectivity (OSPF L3Out): aci/external-l3-connectivity.md
      - Routing & Route Sharing:
          - Transit Routing Configuration: aci/transit-routing.md
          - Enable Transit Routing: aci/enable-transit-routing.md
          - Shared L3OUT (VRF Leaking): aci/shared-l3out.md
          - Inter-VRF Route-Leaking: aci/inter-vrf-route-leaking.md
      - Multi-Fabric:
          - Multi-Pod Fabric Bring Up – from Scratch!: aci/multipod-fabric-bring-up.md
          - Multi-Site Configuration: aci/multi-site-bring-up.md
      - Operations & Visibility:
          - Local SPAN, Ethanalyzer & SPAN-to-CPU: aci/local-span.md
  - VXLAN EVPN:
      - Overview: vxlan-evpn/index.md
      - VXLAN BGP EVPN (CLI) – Single Site: vxlan-evpn/single-site-cli.md
      - Building a VXLAN EVPN Fabric with Cisco NDFC: vxlan-evpn/fabric-fundamentals.md
      - VXLAN BGP EVPN Fabric Bring Up Using NDFC – Single Site: vxlan-evpn/single-site-ndfc.md
      - VXLAN BGP EVPN Multi-Site (CLI) Configuration and Verification: vxlan-evpn/multi-site-cli.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
