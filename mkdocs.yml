site_name: CCIE Data Center Guided Labs
site_url: https://titusm.github.io/Cisco-Data-Center/
repo_url: https://github.com/TitusM/Cisco-Data-Center
repo_name: TitusM/Cisco-Data-Center

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.collapse
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - UCS & SAN:
      - End-to-End Guided Lab:
          - Overview: ucs-san/00-overview.md
          - Pre-Lab Checklist: ucs-san/01-pre-lab.md
          - 01 · Compute Policies: ucs-san/02-compute-policies.md
          - 02 · SAN/LAN Uplinks: ucs-san/03-uplinks.md
          - 03 · Port Modes: ucs-san/04-port-modes.md
          - 04 · FC and FCoE: ucs-san/05-fc-fcoe.md
          - 05 · Zoning: ucs-san/06-zoning.md
          - 06 · NPV / NPIV: ucs-san/07-npv-npiv.md
          - 07 · Trunking: ucs-san/08-trunking.md
          - 08 · PortChannel: ucs-san/09-portchannel.md
          - 09 · Load Balancing: ucs-san/10-load-balancing.md
          - 10 · SAN Boot Verification: ucs-san/11-san-boot-verification.md
          - 11 · Troubleshooting Drill: ucs-san/12-troubleshooting-drill.md
          - Appendix: ucs-san/13-appendix.md
      - Standalone Labs:
          - Configure a Service Profile: ucs-san/14-service-profile-standalone.md
          - Configure Basic Identity Pools: ucs-san/15-identity-pools-standalone.md
  - NX-OS:
      - Overview: nx-os/index.md
      - Virtual Port-Channel Basic Configuration: nx-os/virtual-port-channel-basic-configuration.md
  - ACI:
      - Overview: aci/index.md
      - Fabric Bring Up – from Scratch!: aci/fabric-bring-up.md
      - Multi-Pod Fabric Bring Up – from Scratch!: aci/multipod-fabric-bring-up.md
      - Multi-Site Configuration: aci/multi-site-bring-up.md
      - Virtual Port-Channel (vPC): aci/virtual-port-channel-vpc.md
      - Cisco Application Centric Infrastructure (ACI) Contracts: aci/contracts.md
      - Cisco ACI L3OUT (BGP & OSPF) Configuration: aci/l3out-bgp-ospf.md
      - Endpoint Security Groups (ESGs): aci/endpoint-security-groups.md
      - ACI Local SPAN (Access), Nexus 9000 Ethanalyzer & SPAN-to-CPU: aci/local-span.md
      - Cisco ACI Transit Routing Configuration: aci/transit-routing.md
  - VXLAN EVPN: vxlan-evpn/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
